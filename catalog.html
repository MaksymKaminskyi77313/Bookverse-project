<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVerse - Catalog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">BookVerse</a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="catalog.html" class="active">Catalog</a></li>
            <li><a href="admin.html">Admin Panel</a></li>
        </ul>
    </nav>

    <section class="catalog-section" style="padding: 120px 8% 60px 8%;">
        <h2 class="section-title">Explore <span>All Books</span></h2>

        <div class="catalog-controls" style="display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap;">
            <input type="text" id="catalog-search" placeholder="Search by title or author..." style="flex: 2; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; min-width: 250px;">
            
            <select id="catalog-filter-category" style="flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; min-width: 150px;">
                <option value="all">All Categories</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="History">History</option>
                <option value="Business">Business</option>
                <option value="Romance">Romance</option>
                <option value="Psychology">Psychology</option>
            </select>

            <select id="catalog-sort" style="flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; min-width: 150px;">
                <option value="default">Default Sorting</option>
                <option value="az">Alphabetical (A-Z)</option>
                <option value="za">Alphabetical (Z-A)</option>
            </select>
        </div>

        <div id="catalog-grid" class="books-grid">
            <p style="color:#666; font-size:18px; grid-column:1/-1; text-align:center;">Loading books...</p>
        </div>
    </section>

    <div id="details-book-modal" class="modal">
        <div class="modal-content">
            <span id="close-details-modal" class="close-btn">&times;</span>
            <div class="modal-flex" style="display: flex; gap: 30px; margin-top: 20px;">
                <img id="modal-view-img" src="" alt="" style="width: 200px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);">
                <div>
                    <h2 id="modal-view-title" style="color:#a855f7; margin-bottom: 5px;"></h2>
                    <p id="modal-view-author" style="color:#aaa; font-style: italic; margin-bottom: 15px;"></p>
                    <span id="modal-view-category" style="background: rgba(168,85,247,0.2); color:#a855f7; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;"></span>
                    <p id="modal-view-description" style="margin-top: 20px; line-height: 1.6; color:#ddd;"></p>
                    <div style="margin-top:20px;">
                        <button class="btn-danger" id="catalog-delete-btn" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">
                            <i class="fa-solid fa-trash"></i> Delete Book
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const catalogGrid = document.getElementById("catalog-grid");
        const catSearch   = document.getElementById("catalog-search");
        const catFilter   = document.getElementById("catalog-filter-category");
        const catSort     = document.getElementById("catalog-sort");

        const urlParams = new URLSearchParams(window.location.search);
        const catParam  = urlParams.get('category');
        if (catParam) catFilter.value = catParam;

        function renderBooks(data) {
            catalogGrid.innerHTML = "";

            if (data.length === 0) {
                catalogGrid.innerHTML = `<p style="color:#666; font-size:18px; grid-column:1/-1; text-align:center;">No books found matching your criteria.</p>`;
                return;
            }

            data.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <img src="${book.image || book.img || ''}" alt="${book.title}">
                    <h3>${book.title}</h3>
                    <p>By ${book.author}</p>
                `;
                card.addEventListener("click", () => openCatalogModal(book));
                catalogGrid.appendChild(card);
            });
        }

        function renderCatalog() {
            let data = [...booksDatabase];

            const query = catSearch.value.toLowerCase().trim();
            if (query) {
                data = data.filter(b =>
                    b.title.toLowerCase().includes(query) ||
                    b.author.toLowerCase().includes(query)
                );
            }

            const category = catFilter.value;
            if (category !== "all") {
                data = data.filter(b => b.category === category);
            }

            const sort = catSort.value;
            if (sort === "az") data.sort((a, b) => a.title.localeCompare(b.title));
            if (sort === "za") data.sort((a, b) => b.title.localeCompare(a.title));

            renderBooks(data);
        }

        function openCatalogModal(book) {
            document.getElementById("modal-view-title").innerText       = book.title;
            document.getElementById("modal-view-author").innerText      = `By ${book.author}`;
            document.getElementById("modal-view-category").innerText    = book.category;
            document.getElementById("modal-view-description").innerText = book.description || "";
            document.getElementById("modal-view-img").src               = book.image || book.img || "";

            const deleteBtn = document.getElementById("catalog-delete-btn");
            deleteBtn.onclick = async function () {
                if (!confirm("Delete this book?")) return;
                await fetch(`${API_URL}/${book.id}`, { method: "DELETE" });
                booksDatabase = booksDatabase.filter(b => b.id !== book.id);
                document.getElementById("details-book-modal").classList.remove("active");
                renderCatalog();
            };

            document.getElementById("details-book-modal").classList.add("active");
        }
        document.getElementById("close-details-modal").addEventListener("click", () => {
            document.getElementById("details-book-modal").classList.remove("active");
        });

        async function initCatalog() {
            try {
                const res = await fetch(API_URL);
                booksDatabase = await res.json();
            } catch (err) {
                console.error("Failed to load books:", err);
                catalogGrid.innerHTML = `<p style="color:#ef4444; grid-column:1/-1; text-align:center;">Could not connect to backend. Is Spring Boot running?</p>`;
                return;
            }
            renderCatalog();
        }

        catSearch.addEventListener("input",  renderCatalog);
        catFilter.addEventListener("change", renderCatalog);
        catSort.addEventListener("change",   renderCatalog);

        window.addEventListener("load", initCatalog);
    </script>
</body>
</html>
